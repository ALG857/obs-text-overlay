<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OBS Text Overlay</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }

  #text {
    font-family: Arial, sans-serif;
    font-size: 72px;
    font-weight: bold;
    color: white;
    text-align: center;
    width: 100%;
    position: absolute;
    top: 40%;
    transform: translateY(-50%);
  }
</style>
</head>

<body>
  <div id="text" contenteditable="true">
    FUCK YOU
  </div>
</body>
</html>
